server:
  port: 7070
spring:
  application:
    name: course-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5050/securityDB}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:jack}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
security:
  jwt:
    secretKey: ${SECURITY_JWT_SECRET_KEY:SkFDS09NQVJQRVJFWjEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MA==}
    expirationTime: ${SECURITY_JWT_EXPIRATION_TIME:3600000}
